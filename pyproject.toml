[project]
name = "Call_Me_Maybe"
version = "0.1.0"
description = " function calling in LLMs using restricted decoding"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "huggingface-hub>=0.20.0",
    "numpy>=2.2.6",
    "pydantic>=2.12.5",
    "transformers>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_sdk"]
